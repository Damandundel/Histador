name: Deploy to Azure

# Every merge to master: build, test, migrate Azure SQL, deploy to App Service, then check /health.
# One-time setup (Azure resources, secrets and variables) is in README.md -> "Deploy to Azure".
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure, no long-lived password stored in GitHub
  contents: read

# Never run two deployments at once; a newer merge waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped (not failed) until the Azure variables are configured.
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      FIREWALL_RULE: github-actions-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Histador.sln

      - name: Build
        run: dotnet build Histador.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Histador.sln --no-build --configuration Release

      - name: Publish
        run: dotnet publish Histador.csproj --no-build --configuration Release --output ./publish

      - name: Build migrations bundle
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          dotnet ef migrations bundle --project Histador.csproj --configuration Release \
            --target-runtime linux-x64 --self-contained --output ./efbundle --force
        env:
          # Only needed so the design-time host starts; the bundle gets the real one via --connection.
          ConnectionStrings__DefaultConnection: Server=unused;Database=unused

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open SQL firewall for this runner
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER }}" \
            --name "$FIREWALL_RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Apply database migrations
        run: ./efbundle --connection "$CONNECTION_STRING"
        env:
          CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Close SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER }}" \
            --name "$FIREWALL_RULE" || true

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Check /health
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors --max-time 30 \
            "${{ steps.deploy.outputs.webapp-url }}/health"
